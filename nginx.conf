events {}

http {
    upstream portal {
        server app:8000;
    }
    upstream citizen_mcp {
        server citizen-mcp:8001;
    }
    upstream officer_mcp {
        server officer-mcp:8002;
    }
    upstream eval_dash {
        server eval:8003;
    }

    server {
        listen 80;
        server_name _;

        # ── Citizen MCP — streamable HTTP with SSE ──────────────────────────
        # Clients connect to /mcp/citizen; nginx strips the prefix and
        # forwards to /mcp on the citizen-mcp container.
        location /mcp/citizen {
            proxy_pass http://citizen_mcp/mcp;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            chunked_transfer_encoding on;
        }

        # ── Officer MCP — streamable HTTP with SSE ──────────────────────────
        location /mcp/officer {
            proxy_pass http://officer_mcp/mcp;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            chunked_transfer_encoding on;
        }

        # ── Eval dashboard ──────────────────────────────────────────────────
        location /eval-dashboard {
            proxy_pass http://eval_dash/eval-dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Portal (everything else) ────────────────────────────────────────
        location / {
            proxy_pass http://portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            # Needed for the SMS gateway SSE console
            proxy_buffering off;
        }
    }
}
