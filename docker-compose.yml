services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-deploying}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sewasetu -d sewasetu"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sewasetu
      DB_USER: sewasetu
      DB_PASS: ${POSTGRES_PASSWORD:-change-me-before-deploying}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the environment}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      smsgw:
        condition: service_healthy
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  scheduler:
    build:
      context: ./app
      dockerfile: Dockerfile
    healthcheck:
      disable: true
    command: ["sh", "-c", "while true; do python /app/scripts/deemed_approval.py; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    expose:
      - "8025"

  citizen-mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    command: ["python", "citizen_server.py"]
    environment:
      CITIZEN_MCP_PORT: "8001"
      MCP_HEALTH_PORT: "8001"
      CITIZEN_MCP_URL: ${PUBLIC_BASE_URL:-http://localhost}/mcp/citizen
      PORTAL_URL: http://app:8000
      PORTAL_ISSUER: ${PUBLIC_BASE_URL:-http://localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      MCP_ALLOWED_BLOCKS: ${MCP_ALLOWED_BLOCKS:-Sonari,Rajapara,Dhemaji Pathar,Borgaon,Namti,Khelua}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sewasetu
      DB_USER: sewasetu
      DB_PASS: ${POSTGRES_PASSWORD:-change-me-before-deploying}
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  officer-mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    command: ["python", "officer_server.py"]
    environment:
      OFFICER_MCP_PORT: "8002"
      MCP_HEALTH_PORT: "8002"
      OFFICER_MCP_URL: ${PUBLIC_BASE_URL:-http://localhost}/mcp/officer
      PORTAL_URL: http://app:8000
      PORTAL_ISSUER: ${PUBLIC_BASE_URL:-http://localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sewasetu
      DB_USER: sewasetu
      DB_PASS: ${POSTGRES_PASSWORD:-change-me-before-deploying}
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  eval:
    build:
      context: .
      dockerfile: evals/Dockerfile
    environment:
      EVAL_PORT: "8003"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sewasetu
      DB_USER: sewasetu
      DB_PASS: ${POSTGRES_PASSWORD:-change-me-before-deploying}
    volumes:
      - ./app:/app/app:ro
      - ./mcp:/app/mcp:ro
      - ./personas:/app/personas:ro
      - ./evals:/app/evals
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      citizen-mcp:
        condition: service_started
      officer-mcp:
        condition: service_started
      eval:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  applogs:
